name: Python CI

on:
  push:
    branches: [main, user_experience, feature/*]
  pull_request:
    branches: [main, user_experience, feature/*]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run syntax checks
        run: |
          python -m py_compile app.py
          find . -name "*.py" -not -path "./venv/*" -not -path "./__pycache__/*" -not -path "./.mypy_cache/*" | head -10 | xargs python -m py_compile

      - name: Run tests
        run: |
          python -m pytest
